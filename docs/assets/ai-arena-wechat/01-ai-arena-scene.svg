  <text class="text" x="168" y="170" fill="#11151d">ChatGPT</text>
  <text class="text" x="900" y="170" fill="#11151d">Kimi</text>
  <path class="thin" stroke="#172033" d="M125 222 h238 M125 270 h205 M125 318 h250 M838 222 h235 M838 270 h190 M838 318 h245"/>
  <path class="redline" d="M410 268 C482 228 532 220 566 244"/>
