<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI Arena 使用场景</title>
  <desc id="desc">原创二次元舰装风插画：黑红白海军科技氛围中，指挥官在 ChatGPT 和 Kimi 两块战术屏之间复核答案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="0.48" stop-color="#1d2029"/>
      <stop offset="1" stop-color="#3a0d12"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f2ff"/>
      <stop offset="1" stop-color="#8cb7e8"/>
    </linearGradient>
    <linearGradient id="panelRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#ef6f78"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .line{fill:none;stroke:#f5f5f5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#b8c4d6;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .redline{fill:none;stroke:#ff334e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .text{font-family:Arial,"PingFang SC",sans-serif;font-weight:800;fill:#f8fafc;font-size:34px}
      .small{font-size:22px;font-weight:700}.tiny{font-size:16px;font-weight:600;fill:#dbe4f0}
      .metal{fill:#242a35;stroke:#f8fafc;stroke-width:3}.dark{fill:#11151d}.white{fill:#f4f7fb}.red{fill:#d71935}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 560 C190 520 330 592 520 548 C720 502 850 585 1200 520 L1200 675 L0 675 Z" fill="#090b10" opacity=".72"/>
  <path class="thin" d="M80 575 h1040 M170 620 h870 M295 535 h610"/>
  <circle cx="600" cy="310" r="205" fill="none" stroke="#ff334e" stroke-width="2" opacity=".35"/>
