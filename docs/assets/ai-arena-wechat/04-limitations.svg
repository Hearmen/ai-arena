<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI Arena 边界和风险</title>
  <desc id="desc">原创二次元舰装风风险图：战术屏列出 DOM、origin、登录态、敏感数据等工程边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d14"/><stop offset=".55" stop-color="#1a202b"/><stop offset="1" stop-color="#3b0b12"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .screen{fill:#151b25;stroke:#eef2f7;stroke-width:4}.warn{fill:#331018;stroke:#ff334e;stroke-width:4;filter:url(#glow)}
      .line{fill:none;stroke:#eef2f7;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#96a5ba;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .redline{fill:none;stroke:#ff334e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
      .text{font-family:Arial,"PingFang SC",sans-serif;font-weight:800;fill:#f8fafc;font-size:30px}.small{font-size:22px}.tiny{font-size:17px;fill:#dbe4f0}.red{fill:#e11d38}.white{fill:#f8fafc}.steel{fill:#253041;stroke:#f8fafc;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text class="text" x="414" y="72">能用，不等于没有边界</text>
  <rect class="screen" x="90" y="125" width="465" height="360" rx="18"/>
  <path class="thin" d="M90 188 h465 M130 232 h360 M130 282 h305 M130 332 h370 M130 382 h290"/>
  <g transform="translate(326 445)">
    <path class="steel" d="M-70 -92 C-36 -132 36 -132 70 -92 L56 4 C38 36 -38 36 -56 4 Z"/>
    <path class="white" d="M-44 -70 C-18 -94 18 -94 44 -70 C24 -54 -24 -54 -44 -70Z"/>
    <circle cx="-24" cy="-38" r="5" fill="#10141d"/><circle cx="24" cy="-38" r="5" fill="#10141d"/>
    <path class="red" d="M-8 -112 h16 v36 H-8z"/>
    <path class="line" d="M-94 18 h188 M-48 34 v78 M48 34 v78"/>
  </g>
  <rect class="warn" x="640" y="124" width="430" height="78" rx="14"/>
  <rect class="warn" x="640" y="237" width="430" height="78" rx="14"/>
  <rect class="warn" x="640" y="350" width="430" height="78" rx="14"/>
  <rect class="warn" x="640" y="463" width="430" height="78" rx="14"/>
  <text class="text small" x="680" y="173">DOM 改版会打断选择器</text>
  <text class="text small" x="680" y="286">postMessage origin 需要收紧</text>
  <text class="text small" x="680" y="399">Kimi 面板依赖网页登录态</text>
  <text class="text small" x="680" y="512">敏感数据不能随手发送</text>
  <path class="redline" d="M558 210 C590 182 610 166 640 163 M558 286 C592 282 612 278 640 276 M558 362 C590 385 612 395 640 389 M558 432 C590 472 612 498 640 502"/>
  <path class="thin" d="M106 560 h988 M180 605 h840"/>
  <text class="tiny" x="387" y="626">browser automation is useful, but the sea is still moving</text>
</svg>
