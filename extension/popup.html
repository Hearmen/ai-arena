<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #111827;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
    }
    .shortcut {
      margin-top: 12px;
      padding: 8px 12px;
      background: #eff6ff;
      border-radius: 6px;
      font-size: 12px;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <h1>🎯 AI Arena</h1>
  <div class="status">
    <div class="status-dot"></div>
    <span>运行中</span>
  </div>
  <div class="info">
    在 ChatGPT 页面右下角点击 🎯 按钮展开 Kimi 分析面板。
  </div>
  <div class="shortcut">
    💡 点击 ChatGPT 输入区的"让 Kimi 分析"按钮即可发送对话给 Kimi 分析。
  </div>
</body>
</html>
