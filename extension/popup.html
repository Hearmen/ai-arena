<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI Arena</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 420px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .section {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    .provider-select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #333;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .provider-select:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #764ba2;
      box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #555;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .provider-info {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>🎯 AI Arena</h1>

  <div class="section">
    <label for="providerSelect">选择分析模型</label>
    <select id="providerSelect" class="provider-select">
      <option value="kimi">Kimi</option>
      <option value="doubao">豆包</option>
      <option value="none">关闭</option>
    </select>
    <div class="provider-info">切换后将在当前 ChatGPT 页面生效</div>
  </div>

  <div class="section">
    <label for="promptTemplate">分析 Prompt 模板</label>
    <textarea id="promptTemplate" placeholder="在此输入 Prompt 模板..."></textarea>
    <div class="hint">💡 保留 {conversation_history} 占位符，它会被替换为对话内容</div>
  </div>

  <div class="buttons">
    <button id="resetBtn" class="btn-secondary">恢复默认</button>
    <button id="applyBtn" class="btn-primary">应用到当前页面</button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
