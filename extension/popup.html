<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    .status-dot.connected {
      background: #10b981;
    }
    .status-dot.disconnected {
      background: #ef4444;
    }
    .config {
      margin-top: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <h1>AI Arena Bridge</h1>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">检查中...</span>
  </div>
  <div class="config">
    <label for="wsUrl">后端地址</label>
    <input type="text" id="wsUrl" value="ws://localhost:8000" />
    <button id="saveBtn">保存设置</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
